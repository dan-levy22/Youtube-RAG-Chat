# docker-compose.yml (Production Base)

services:
  backend:
    build:
      context: .
      dockerfile: ./app/Dockerfile
      target: production
    env_file: # PHASE 2 (Service-level)
      - .env
    container_name: backend
    # Note: No ports are exposed to the host by default in production.
    # This would typically be handled by a reverse proxy like Nginx.
    environment:
      - EXECUTION_ENVIRONMENT=docker
      - DB_HOST=db
      # - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # - GEMINI_API_KEY=${GEMINI_API_KEY}
      # - PROXY_URL=${PROXY_URL}
      # - CHROMA_HOST=chromadb
    depends_on:
      db:
        condition: service_healthy
      chromadb:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: frontend
    ports:
      - "8501:8501" # We keep this port as it's the main entrypoint
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend

  chromadb:
    image: chromadb/chroma
    container_name: chromadb
    volumes:
      - chroma_data:/chroma/chroma

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    env_file: .env
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  chroma_data:
  postgres_data: